name: Android Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  unsigned-release:
    name: Build Unsigned Release APK (F-Droid)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x droid/gradlew

    - name: Build Release APK (unsigned)
      working-directory: ./droid
      run: ./gradlew assembleRelease --stacktrace

    - name: Rename APKs
      run: |
        # Get universal APK
        find droid/app/build/outputs/apk/release -name "*-universal-release.apk" -exec cp {} inbe-release-universal.apk \; 2>/dev/null || true
        # Get any release APK as fallback
        find droid/app/build/outputs/apk/release -name "*.apk" -exec cp {} inbe-release.apk \; 2>/dev/null || true

    - name: Upload Unsigned APK
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-release-apk
        path: |
          inbe-release-universal.apk
          inbe-release.apk
        if-no-files-found: warn

  signed-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x droid/gradlew

    - name: Create keystore directory
      run: mkdir -p ~/.android

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "KEYSTORE_BASE64 secret not set"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/inbe-release.keystore
        echo "Keystore decoded successfully"

    - name: Build Signed Release APK
      working-directory: ./droid
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -Pkeystore.password="$KEYSTORE_PASSWORD" \
          -Pkeystore.path="/home/runner/.android/inbe-release.keystore" \
          --stacktrace

    - name: Rename Signed APK
      run: |
        # Get universal signed APK
        find droid/app/build/outputs/apk/release -name "*-universal-release.apk" -exec cp {} inbe-signed-release-universal.apk \; 2>/dev/null || true
        # Get any signed APK as fallback
        find droid/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" -exec cp {} inbe-signed-release.apk \; 2>/dev/null || true

    - name: Verify APK Signature
      run: |
        if [ -f inbe-signed-release.apk ]; then
          echo "APK exists, checking signature..."
          # Check if APK is signed using apksigner (available in Android SDK)
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs inbe-signed-release.apk || echo "apksigner not available, skipping verification"
        else
          echo "No signed APK found"
          ls -la droid/app/build/outputs/apk/release/
        fi

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: signed-release-apk
        path: |
          inbe-signed-release-universal.apk
          inbe-signed-release.apk
        if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [unsigned-release, signed-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Unsigned APK
      uses: actions/download-artifact@v4
      with:
        name: unsigned-release-apk
        path: .

    - name: Download Signed APK
      uses: actions/download-artifact@v4
      with:
        name: signed-release-apk
        path: .
        if-no-files-found: ignore

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          inbe-release*.apk
          inbe-signed*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
