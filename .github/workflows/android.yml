name: Android Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  unsigned-release:
    name: Build Unsigned Release APK (for F-Droid)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0  # Need full history for tag checking

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x droid/gradlew

    - name: Build Release APK (unsigned)
      working-directory: ./droid
      run: ./gradlew assembleRelease --stacktrace

    - name: Rename APKs
      run: |
        # Get universal APK
        find droid/app/build/outputs/apk/release -name "*-universal-release.apk" -exec cp {} inbe-release-universal.apk \; 2>/dev/null || true
        # Get any release APK as fallback
        find droid/app/build/outputs/apk/release -name "*.apk" -exec cp {} inbe-release.apk \; 2>/dev/null || true

    - name: Upload Unsigned APK
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-release-apk
        path: |
          inbe-release-universal.apk
          inbe-release.apk
        if-no-files-found: warn

    - name: Create and Push Tag (if new version)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        # Extract versionName from build.gradle
        VERSION=$(grep "versionName" droid/app/build.gradle | awk '{print $2}' | tr -d '"')
        TAG="v$VERSION"

        echo "Found version: $VERSION"
        echo "Checking for tag: $TAG"

        # Check if tag already exists
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists, skipping..."
        else
          echo "Creating new tag: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"
          echo "Tag $TAG created and pushed!"
        fi
