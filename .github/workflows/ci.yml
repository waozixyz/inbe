name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      APT_CACHE_DIR: /tmp/apt-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Cache Test apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: test-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/test-packages.txt') }}
          restore-keys: |
            test-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Test Dependencies
        run: |
          set -euo pipefail
          mapfile -t packages < .github/apt/test-packages.txt
          mkdir -p "$APT_CACHE_DIR/partial"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$APT_CACHE_DIR" \
            install -y "${packages[@]}"
          sudo chown -R "$USER:$USER" "$APT_CACHE_DIR"

      - name: Run Tests
        run: make test

  krb-native-exactness:
    # Cartridge-vs-native screenshot gate: kryon's krb_exact_native_test.sh
    # renders the same screen as a .krb cartridge and as this C build, then
    # pixel-compares with zero tolerance. xvfb gives the working GL readback
    # this dev box lacks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb \
            build-essential pkg-config zlib1g-dev x11-utils imagemagick xdotool \
            xcompmgr \
            libsdl2-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgtk-3-dev
      - name: Build native
        run: make native
      - name: Build kryon cartridge tooling
        run: |
          make -C vendor/kryon build/linux-x86_64/bin/k2b                build/linux-x86_64/bin/krb-run                KRY_SW_SRCS="src/krb/krb.c src/backend/kry_backend.c src/backend/kry_sw.c src/backend/kry_backend_rec.c"
      - name: Language screen — native vs cartridge, 0 pixel tolerance
        run: |
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=softpipe xvfb-run -a --server-args="-screen 0 1280x1024x24" sh vendor/kryon/tests/krb_exact_native_test.sh build/bin/linux/inbe-linux-x86_64 language vendor/kryon/examples/20_inbe_language.kry "$PWD"

          rc=$?
          cp /tmp/kryon-krb-native.*/native.png /tmp/native.png 2>/dev/null || true
          cp /tmp/kryon-krb-native.*/cart.png /tmp/cart.png 2>/dev/null || true
          exit $rc
      - name: Upload comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exactness-frames
          path: |
            /tmp/native.png
            /tmp/cart.png
          if-no-files-found: ignore

  build-chrome-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    needs: test
    env:
      APT_CACHE_DIR: /tmp/apt-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Cache Web apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: web-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/web-packages.txt') }}
          restore-keys: |
            web-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Web Dependencies
        run: |
          set -euo pipefail
          mapfile -t packages < .github/apt/web-packages.txt
          mkdir -p "$APT_CACHE_DIR/partial"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$APT_CACHE_DIR" \
            install -y "${packages[@]}"
          sudo chown -R "$USER:$USER" "$APT_CACHE_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build Chrome Extension ZIP
        run: |
          set -euo pipefail
          make package-unpackaged-assets
          make chrome-web-store
          test -f build/dist/inbe-chrome-web-store.zip

      - name: Run Web Smoke Test
        run: |
          set -euo pipefail
          make web-smoke-test

  build-firefox-addons:
    name: Build Firefox Add-on
    runs-on: ubuntu-latest
    needs: test
    env:
      APT_CACHE_DIR: /tmp/apt-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Cache Web apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: web-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/apt/web-packages.txt') }}
          restore-keys: |
            web-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Web Dependencies
        run: |
          set -euo pipefail
          mapfile -t packages < .github/apt/web-packages.txt
          mkdir -p "$APT_CACHE_DIR/partial"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$APT_CACHE_DIR" \
            install -y "${packages[@]}"
          sudo chown -R "$USER:$USER" "$APT_CACHE_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build Firefox Add-on ZIP
        run: |
          set -euo pipefail
          make package-unpackaged-assets
          make firefox-addons
          test -f build/dist/inbe-firefox-addons.zip
          make firefox-addons-lint

      - name: Install Firefox (Mozilla build)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb \
            libgl1-mesa-dri libgl1 libegl1 mesa-utils || true
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libx11-xcb1 libxcb-shm0 libasound2t64 libdbus-glib-1-2 \
            libxt6t64 libxtst6 libpci3 || \
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libx11-xcb1 libxcb-shm0 libasound2 libdbus-glib-1-2 libxt6 libxtst6 libpci3
          curl -sL "https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US" \
            -o "$HOME/firefox.tar.xz"
          tar -xJf "$HOME/firefox.tar.xz" -C "$HOME"
          test -x "$HOME/firefox/firefox"
          echo "$HOME/firefox" >> "$GITHUB_PATH"

      - name: Run Web Smoke Test (Firefox)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1280x1024x24" make web-smoke-test-firefox
