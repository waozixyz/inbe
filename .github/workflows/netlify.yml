name: Netlify

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Packages
        timeout-minutes: 15
        run: .github/scripts/install-apt-packages.sh .github/apt/web-packages.txt

      - name: Set Up Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk" >> "$GITHUB_PATH"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Build Site
        run: |
          set -euo pipefail
          make site
          test -f build/site/index.html
          test -f build/site/build/web/index.html
          test -f build/site/build/web/index.js
          test -f build/site/build/web/index.wasm
          make site-release-assets-check

      - name: Upload Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inbe-site
          path: build/site
          if-no-files-found: error

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: inbe-site
          path: build/site

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy Preview To Netlify
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          netlify deploy \
            --dir build/site \
            --no-build \
            --alias "pr-${{ github.event.pull_request.number }}" \
            --message "Preview ${{ github.event.pull_request.number }}" \
            --auth "$auth_token" \
            --site "$site_id"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

    steps:
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: inbe-site
          path: build/site

      - name: Package Site
        run: |
          set -euo pipefail
          test -f build/site/index.html
          cd build/site
          python3 -m zipfile -c ../inbe-site.zip .
          test -s ../inbe-site.zip

      - name: Deploy Production To Netlify
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          test -n "$auth_token" || { echo "::error::NETLIFY_AUTH_TOKEN is empty or missing"; exit 1; }
          test -n "$site_id" || { echo "::error::NETLIFY_SITE_ID is empty or missing"; exit 1; }

          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $auth_token" \
            -H "Content-Type: application/zip" \
            --data-binary "@build/inbe-site.zip" \
            "https://api.netlify.com/api/v1/sites/$site_id/deploys")"

          python3 -c 'import json, sys; deploy = json.loads(sys.argv[1]); state = deploy.get("state", ""); url = deploy.get("ssl_url") or deploy.get("url") or deploy.get("deploy_ssl_url") or deploy.get("deploy_url") or deploy.get("id"); print(f"Netlify deploy {state}: {url}"); raise SystemExit(1 if state in ("error", "failed") else 0)' "$response"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
