plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.waozi.inbe'
    compileSdk 34

    def keystorePropsFile = rootProject.file("local.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    def getKeystorePath = { -> keystoreProps['keystore.path'] }

    def releasePassword = project.findProperty('keystore.password') ?: ""

    signingConfigs {
        release {
            storeFile getKeystorePath() ? file(getKeystorePath()) : null
            storePassword releasePassword
            keyAlias "inbe-key"
            keyPassword releasePassword
        }
    }

    defaultConfig {
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(":app:assembleRelease") && !project.findProperty('keystore.password')) {
        throw new GradleException("Use: make release PASSWORD=your-password")
    }
}
