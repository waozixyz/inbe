plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.waozi.inbe'
    compileSdk 35
    ndkVersion "25.1.8937393"

    def keystorePropsFile = rootProject.file("local.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    def getKeystorePath = { -> keystoreProps['keystore.path'] ?: System.getenv("HOME") + "/.android/inbe-release.keystore" }

    def releasePassword = project.findProperty('keystore.password') ?: ""

    signingConfigs {
        release {
            storeFile getKeystorePath() ? file(getKeystorePath()) : null
            storePassword releasePassword
            keyAlias "inbe-key"
            keyPassword releasePassword
        }
    }

    defaultConfig {
        minSdk 19
        targetSdk 35
        versionCode 8
        versionName "1.0.7"
    }
    

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(":app:assembleRelease") && !project.findProperty('keystore.password')) {
        throw new GradleException("Use: make android-release PASSWORD=your-password")
    }
}

dependencies {
}
