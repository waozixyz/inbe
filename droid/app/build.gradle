plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.waozi.inbe'
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    def keystorePropsFile = rootProject.file("local.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    def getKeystorePath = { -> project.findProperty('keystore.path') ?: keystoreProps['keystore.path'] ?: System.getenv("HOME") + "/.android/kryon-release.keystore" }
    def getKeystoreAlias = { -> project.findProperty('keystore.alias') ?: keystoreProps['keystore.alias'] ?: "inbe-key" }

    def releasePassword = project.findProperty('keystore.password') ?: ""

    signingConfigs {
        release {
            storeFile getKeystorePath() ? file(getKeystorePath()) : null
            storePassword releasePassword
            keyAlias getKeystoreAlias()
            keyPassword releasePassword
        }
    }

    defaultConfig {
        minSdk 21
        targetSdk 36
        versionCode 90
        versionName "1.8.15"
        externalNativeBuild {
            cmake {
                if (System.getProperty('os.name').toLowerCase().contains('freebsd')) {
                    arguments '-DANDROID_HOST_TAG=linux-x86_64',
                              '-DANDROID_USE_LEGACY_TOOLCHAIN_FILE=ON'
                }
            }
        }
    }
    

    buildTypes {
        release {
            signingConfig project.hasProperty('fDroidBuild') ? null : signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }

    dependenciesInfo {
        includeInApk = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(":app:assembleRelease")
        && !project.findProperty('keystore.password')
        && !project.hasProperty('fDroidBuild')) {
        throw new GradleException("Use: make android-release PASSWORD=your-password")
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
