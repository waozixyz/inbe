<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8" />
<head>
	<title>Inner Breeze Legacy Data Converter</title>
	<link href="/style.css" rel="stylesheet" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Convert inbe-legacy JSON exports into the current Inner Breeze import ZIP format.">
	<link rel="canonical" href="https://inbe.waozi.xyz/legacy-converter.html">
</head>

<body>
	<div class="content">
		<main id="main-content">
			<section class="tool-section">
				<h1>Legacy Data Converter</h1>
				<p>Coming from inbe-legacy? Convert the old JSON export into the ZIP file used by the current Inner Breeze import tool.</p>
				<p class="safety-note"><em>This runs entirely in your browser. Your file is not uploaded.</em></p>

				<div class="converter-panel">
					<label for="legacy-file">inbe-legacy JSON export</label>
					<input id="legacy-file" type="file" accept=".json,application/json">
					<button id="convert-button" type="button">Convert to Inbe ZIP</button>
					<p id="converter-status" class="converter-status" role="status">Choose an inbe-legacy JSON export.</p>
				</div>

				<p><a href="/">Back to downloads</a></p>
			</section>
		</main>
		<footer>
			<p>&copy; 2026 <a href="https://waozi.xyz">Waozi</a> | <a href="/privacy.html">Privacy Policy</a></p>
		</footer>
	</div>

	<script>
	(function() {
		"use strict";

		var fileInput = document.getElementById("legacy-file");
		var convertButton = document.getElementById("convert-button");
		var statusEl = document.getElementById("converter-status");

		function setStatus(message, isError) {
			statusEl.textContent = message;
			statusEl.className = isError ? "converter-status error" : "converter-status";
		}

		function pad(value, width) {
			var text = String(value);
			while(text.length < width) text = "0" + text;
			return text;
		}

		function dosDateTime(date) {
			var year = date.getFullYear();
			if(year < 1980) year = 1980;
			return {
				time: (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2),
				date: ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate()
			};
		}

		var crcTable = null;
		function makeCrcTable() {
			var table = [];
			for(var n = 0; n < 256; n++) {
				var c = n;
				for(var k = 0; k < 8; k++) {
					c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
				}
				table[n] = c >>> 0;
			}
			return table;
		}

		function crc32(bytes) {
			if(crcTable === null) crcTable = makeCrcTable();
			var crc = 0 ^ -1;
			for(var i = 0; i < bytes.length; i++) {
				crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xff];
			}
			return (crc ^ -1) >>> 0;
		}

		function writeU16(out, value) {
			out.push(value & 255, (value >>> 8) & 255);
		}

		function writeU32(out, value) {
			out.push(value & 255, (value >>> 8) & 255, (value >>> 16) & 255, (value >>> 24) & 255);
		}

		function appendBytes(out, bytes) {
			for(var i = 0; i < bytes.length; i++) out.push(bytes[i]);
		}

		function makeZip(files) {
			var encoder = new TextEncoder();
			var out = [];
			var central = [];
			var now = dosDateTime(new Date());

			files.forEach(function(file) {
				var nameBytes = encoder.encode(file.name);
				var dataBytes = encoder.encode(file.content);
				var crc = crc32(dataBytes);
				var offset = out.length;

				writeU32(out, 0x04034b50);
				writeU16(out, 20);
				writeU16(out, 0);
				writeU16(out, 0);
				writeU16(out, now.time);
				writeU16(out, now.date);
				writeU32(out, crc);
				writeU32(out, dataBytes.length);
				writeU32(out, dataBytes.length);
				writeU16(out, nameBytes.length);
				writeU16(out, 0);
				appendBytes(out, nameBytes);
				appendBytes(out, dataBytes);

				writeU32(central, 0x02014b50);
				writeU16(central, 20);
				writeU16(central, 20);
				writeU16(central, 0);
				writeU16(central, 0);
				writeU16(central, now.time);
				writeU16(central, now.date);
				writeU32(central, crc);
				writeU32(central, dataBytes.length);
				writeU32(central, dataBytes.length);
				writeU16(central, nameBytes.length);
				writeU16(central, 0);
				writeU16(central, 0);
				writeU16(central, 0);
				writeU16(central, 0);
				writeU32(central, 0);
				writeU32(central, offset);
				appendBytes(central, nameBytes);
			});

			var centralOffset = out.length;
			appendBytes(out, central);
			writeU32(out, 0x06054b50);
			writeU16(out, 0);
			writeU16(out, 0);
			writeU16(out, files.length);
			writeU16(out, files.length);
			writeU32(out, central.length);
			writeU32(out, centralOffset);
			writeU16(out, 0);

			return new Blob([new Uint8Array(out)], {type: "application/zip"});
		}

		function sessionDate(session) {
			var id = session && session.id;
			var dateTime = session && session.dateTime;
			var numeric = Number(id);
			var date;

			if(Number.isFinite(numeric) && numeric > 0) {
				date = new Date(numeric);
			} else if(typeof id === "string") {
				date = new Date(id);
			}

			if((!date || Number.isNaN(date.getTime())) && typeof dateTime === "string") {
				date = new Date(dateTime);
			}

			if(!date || Number.isNaN(date.getTime())) {
				return null;
			}
			return date;
		}

		function roundSeconds(value) {
			var number = Number(value);
			if(!Number.isFinite(number) || number <= 0) return 0;
			if(number > 999) number = Math.round(number / 1000);
			else number = Math.round(number);
			if(number < 1 || number > 999) return 0;
			return number;
		}

		function convertLegacy(data) {
			var sessions = Array.isArray(data) ? data : data.sessions;
			var files = [];
			var usedPaths = {};

			if(!Array.isArray(sessions)) {
				throw new Error("No sessions array found in the legacy export.");
			}

			sessions.forEach(function(session) {
				var date = sessionDate(session);
				var rounds = session && session.rounds;
				var seconds = [];
				var path;

				if(!date || !rounds || typeof rounds !== "object") return;

				Object.keys(rounds).sort(function(a, b) {
					return Number(a) - Number(b);
				}).forEach(function(key) {
					var value = roundSeconds(rounds[key]);
					if(value > 0) seconds.push(value);
				});

				if(seconds.length === 0) return;

				path = "lotus-data/sessions/" +
					pad(date.getFullYear(), 4) + "/" +
					pad(date.getMonth() + 1, 2) + "/" +
					pad(date.getDate(), 2) + "/inbe-" +
					pad(date.getHours(), 2) +
					pad(date.getMinutes(), 2) +
					pad(date.getSeconds(), 2);

				while(usedPaths[path]) {
					date = new Date(date.getTime() + 1000);
					path = "lotus-data/sessions/" +
						pad(date.getFullYear(), 4) + "/" +
						pad(date.getMonth() + 1, 2) + "/" +
						pad(date.getDate(), 2) + "/inbe-" +
						pad(date.getHours(), 2) +
						pad(date.getMinutes(), 2) +
						pad(date.getSeconds(), 2);
				}
				usedPaths[path] = true;

				files.push({
					name: path,
					content: seconds.join("\n") + "\n"
				});
			});

			if(files.length === 0) {
				throw new Error("No valid legacy sessions were found.");
			}

			files.unshift({
				name: "lotus-data/metadata.txt",
				content: "Inner Breeze Data Export\nVersion: legacy-converter\nDate: " + new Date().toISOString() + "\nSessions: " + files.length + "\n"
			});

			return {
				count: files.length - 1,
				blob: makeZip(files)
			};
		}

		function downloadBlob(blob, filename) {
			var url = URL.createObjectURL(blob);
			var link = document.createElement("a");
			link.href = url;
			link.download = filename;
			document.body.appendChild(link);
			link.click();
			document.body.removeChild(link);
			setTimeout(function() {
				URL.revokeObjectURL(url);
			}, 1000);
		}

		convertButton.addEventListener("click", function() {
			var file = fileInput.files && fileInput.files[0];
			if(!file) {
				setStatus("Choose a legacy JSON export first.", true);
				return;
			}

			file.text().then(function(text) {
				var data = JSON.parse(text);
				var result = convertLegacy(data);
				downloadBlob(result.blob, "inbe-legacy-converted.zip");
				setStatus("Converted " + result.count + " sessions. Import the downloaded ZIP in Inner Breeze.", false);
			}).catch(function(error) {
				setStatus(error.message || "Conversion failed.", true);
			});
		});
	})();
	</script>
</body>
</html>
