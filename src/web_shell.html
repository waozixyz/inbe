<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Inner Breeze</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inbe.waozi.xyz/">
    <meta property="og:title" content="Inner Breeze">
    <meta property="og:description" content="guided breathing, meditation, and habit tracking">
    <meta property="og:image" content="https://inbe.waozi.xyz/og.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://inbe.waozi.xyz/">
    <meta name="twitter:title" content="Inner Breeze">
    <meta name="twitter:description" content="guided breathing, meditation, and habit tracking">
    <meta name="twitter:image" content="https://inbe.waozi.xyz/og.jpg">
    <meta name="twitter:site" content="@waozixyz">
    <meta name="twitter:creator" content="@waozixyz">
    <link rel="icon" type="image/png" sizes="32x32" href="web-assets/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="web-assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#779999">
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .canvas-stage {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body {
        background: #f4f1e8;
        color: #f7fbf9;
        font-family: ui-monospace, "SFMono-Regular", "Roboto Mono", "Cascadia Mono", "Liberation Mono", monospace;
      }

      .canvas-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        position: relative;
      }

      canvas.emscripten {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        border: 0;
        background: #f4f1e8;
        image-rendering: auto;
      }

      .canvas-frame:fullscreen,
      .canvas-frame:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
      }

      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 38%, rgba(132, 184, 172, 0.24), transparent 36%),
          linear-gradient(180deg, #222640 0%, #17172a 58%, #10131f 100%);
        opacity: 1;
        transition: opacity 360ms ease, visibility 360ms ease;
      }

      .loading-screen.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-panel {
        width: min(360px, 100%);
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .loading-mark {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      }

      .loading-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        font-weight: 700;
      }

      #status {
        min-height: 1.35em;
        color: #c9deda;
        font-size: 13px;
        line-height: 1.35;
      }

      #progress {
        width: min(280px, 100%);
        height: 8px;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      #progress::-webkit-progress-bar {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      #progress::-webkit-progress-value {
        border-radius: 999px;
        background: #8fcfc2;
      }

      #progress::-moz-progress-bar {
        border-radius: 999px;
        background: #8fcfc2;
      }
    </style>
  </head>
  <body>
    <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
      <div class="loading-panel">
        <img class="loading-mark" src="web-assets/icons/icon-192x192.png" alt="" width="76" height="76">
        <h1 class="loading-title">Inner Breeze</h1>
        <div id="status">Downloading...</div>
        <progress value="0" max="100" id="progress" hidden></progress>
      </div>
    </div>
    <div class="canvas-stage">
      <div class="canvas-frame" id="canvas-frame">
        <canvas class="emscripten" id="canvas" width="320" height="560" tabindex="-1"></canvas>
      </div>
    </div>

    <script>
      var statusElement = document.querySelector('#status');
      var progressElement = document.querySelector('#progress');
      var loadingScreen = document.querySelector('#loading-screen');

      function hideLoadingScreen() {
        if (!loadingScreen) return;
        window.requestAnimationFrame(function() {
          loadingScreen.classList.add('is-hidden');
        });
      }

      function scheduleStorageSync(delay, logSuccess) {
        if (typeof FS === 'undefined' || typeof FS.syncfs !== 'function') return;
        Module.__inbeStorageSyncPending = true;
        Module.__inbeStorageSyncLogSuccess = Module.__inbeStorageSyncLogSuccess || !!logSuccess;
        if (Module.__inbeStorageSyncTimer) clearTimeout(Module.__inbeStorageSyncTimer);

        Module.__inbeStorageSyncTimer = setTimeout(function runStorageSync() {
          Module.__inbeStorageSyncTimer = 0;
          if (Module.__inbeStorageSyncing) return;

          Module.__inbeStorageSyncing = true;
          Module.__inbeStorageSyncPending = false;
          var shouldLog = !!Module.__inbeStorageSyncLogSuccess;
          Module.__inbeStorageSyncLogSuccess = false;

          try {
            FS.syncfs(false, function(err) {
              Module.__inbeStorageSyncing = false;
              if (err) console.error('IDBFS save failed:', err);
              else if (shouldLog) console.log('IDBFS synced');

              if (Module.__inbeStorageSyncPending) {
                if (Module.__inbeStorageSyncTimer) clearTimeout(Module.__inbeStorageSyncTimer);
                Module.__inbeStorageSyncTimer = setTimeout(runStorageSync, delay);
              }
            });
          } catch (e) {
            Module.__inbeStorageSyncing = false;
            console.error('IDBFS sync error:', e);
            if (Module.__inbeStorageSyncPending) {
              if (Module.__inbeStorageSyncTimer) clearTimeout(Module.__inbeStorageSyncTimer);
              Module.__inbeStorageSyncTimer = setTimeout(runStorageSync, delay);
            }
          }
        }, delay);
      }

      var Module = {
        __inbeScheduleStorageSync: scheduleStorageSync,
        preRun: [function() {
          if (typeof FS === 'undefined' || typeof IDBFS === 'undefined') {
            console.error('IDBFS unavailable');
            return;
          }

          try {
            FS.mkdir('/home');
          } catch (e) {}

          try {
            FS.mount(IDBFS, { root: '/' }, '/home');
          } catch (e) {
            if (e.errno !== 10 && String(e).indexOf('already mounted') === -1) {
              console.error('IDBFS mount failed:', e);
              return;
            }
          }

          addRunDependency('inbe-idbfs');
          FS.syncfs(true, function(err) {
            if (err) console.error('IDBFS init sync failed:', err);
            else console.log('IDBFS initialized');
            removeRunDependency('inbe-idbfs');
          });
        }],
        postRun: [hideLoadingScreen],
        locateFile: function(path, prefix) {
          if (path === 'index.wasm' || path === 'index.data') {
            return prefix + path + '?v=WEB_CACHE_BUSTER';
          }
          return prefix + path;
        },
        print: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.log(text);
        },
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas') || document.querySelector('canvas.emscripten');
          if (!canvas) {
            canvas = document.createElement('canvas');
            canvas.className = 'emscripten';
            canvas.id = 'canvas';
            canvas.width = 320;
            canvas.height = 560;
            canvas.tabIndex = -1;
            var frame = document.getElementById('canvas-frame') || document.body;
            frame.appendChild(canvas);
          }
          canvas.addEventListener('webglcontextlost', function(e) {
            alert('WebGL context lost. Reload the page to continue.');
            e.preventDefault();
          }, false);
          canvas.addEventListener('contextmenu', function(e) {
            var rect = canvas.getBoundingClientRect();
            var width = canvas.width || rect.width || 1;
            var height = canvas.height || rect.height || 1;

            e.preventDefault();
            Module.__inbeContextClick = {
              x: Math.round((e.clientX - rect.left) * width / Math.max(1, rect.width)),
              y: Math.round((e.clientY - rect.top) * height / Math.max(1, rect.height)),
              time: Date.now()
            };
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;

          var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (match && now - Module.setStatus.last.time < 30) return;

          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;

          if (match) {
            statusElement.textContent = match[1];
            progressElement.value = parseInt(match[2], 10) * 100;
            progressElement.max = parseInt(match[4], 10) * 100;
            progressElement.hidden = false;
          } else {
            statusElement.textContent = text;
            progressElement.hidden = true;
            if (!text) hideLoadingScreen();
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      globalThis.Module = Module;

      Module.setStatus('Downloading...');
      window.onerror = function() {
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };

      (function() {
        var backgroundTimer = 0;
        var lastBackgroundTick = 0;

        function callExport(name, args) {
          var fn = Module && Module['_' + name];
          if (typeof fn !== 'function') return 0;
          try {
            return fn.apply(null, args || []);
          } catch (e) {
            console.error('Web background callback failed:', name, e);
            return 0;
          }
        }

        function playInBackgroundEnabled() {
          return callExport('app_web_get_play_in_background') ? true : false;
        }

        function resumeWebAudio() {
          var miniaudio = window.miniaudio;
          if (!miniaudio || !miniaudio.devices) return;
          miniaudio.devices.forEach(function(device) {
            if (!device || !device.webaudio || device.state !== miniaudio.device_state.started) return;
            if (device.webaudio.state !== 'running') {
              device.webaudio.resume().catch(function(error) {
                console.error('Failed to resume web audio:', error);
              });
            }
          });
        }

        function runBackgroundTick() {
          var now = performance.now();
          var elapsed = lastBackgroundTick ? now - lastBackgroundTick : 0;
          lastBackgroundTick = now;
          resumeWebAudio();
          if (elapsed > 0) callExport('app_web_background_tick', [Math.max(1, Math.round(elapsed))]);
        }

        function stopBackgroundTimer() {
          if (backgroundTimer) {
            clearInterval(backgroundTimer);
            backgroundTimer = 0;
          }
          lastBackgroundTick = 0;
        }

        function startBackgroundTimer() {
          if (backgroundTimer || !playInBackgroundEnabled()) return;
          lastBackgroundTick = performance.now();
          runBackgroundTick();
          backgroundTimer = setInterval(runBackgroundTick, 250);
        }

        function applyVisibilityState() {
          var hidden = document.hidden;
          if (hidden) {
            callExport('app_web_set_backgrounded', [1]);
            startBackgroundTimer();
          } else {
            runBackgroundTick();
            stopBackgroundTimer();
            callExport('app_web_set_backgrounded', [0]);
            resumeWebAudio();
          }
        }

        document.addEventListener('visibilitychange', applyVisibilityState, false);
        window.addEventListener('pagehide', function() {
          callExport('app_web_set_backgrounded', [1]);
          runBackgroundTick();
        }, false);
        window.addEventListener('pageshow', applyVisibilityState, false);
        window.addEventListener('blur', function() {
          if (document.hidden) applyVisibilityState();
        }, false);
        window.addEventListener('focus', applyVisibilityState, false);
      })();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
