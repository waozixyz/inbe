<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://inbe.waozi.xyz/">
    <meta name="twitter:title" content="Inner Breeze">
    <meta name="twitter:description" content="guided breathing meditation based on the Wim Hof method">
    <meta name="twitter:image" content="https://inbe.waozi.xyz/og.jpg">
    <meta name="twitter:site" content="@waozixyz">
    <meta name="twitter:creator" content="@waozixyz">
    <link rel="icon" type="image/png" sizes="32x32" href="/site-icons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/site-icons/apple-icon-180x180.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#779999">
    <link href="/style.css" rel="stylesheet">
    <link href="../../inbe.css" rel="stylesheet">
    <style>
      .web-shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        padding: 16px 12px;
        font-family: departure;
      }

      #status,
      #progress {
        display: none;
      }

      .canvas-frame {
        position: relative;
        z-index: 1;
        width: min(calc(100vw - 24px), calc((100vh - 96px) * 4 / 7));
        max-width: calc(100vw - 24px);
        aspect-ratio: 4 / 7;
        overflow: hidden;
        background: transparent;
      }

      canvas.emscripten {
        position: absolute;
        inset: 0;
        display: block;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        border: 0;
        background: transparent;
        image-rendering: auto;
      }

      .canvas-stage {
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: grid;
        align-items: center;
        justify-content: center;
        place-items: center;
      }

      .canvas-stage:fullscreen {
        display: grid;
        width: 100vw;
        height: 100vh;
      }

      .canvas-stage:-webkit-full-screen {
        display: grid;
        width: 100vw;
        height: 100vh;
      }

      .canvas-stage:fullscreen .canvas-frame {
        width: min(100vw, calc(100vh * 4 / 7));
        max-width: none;
        max-height: 100vh;
      }

      .canvas-stage:-webkit-full-screen .canvas-frame {
        width: min(100vw, calc(100vh * 4 / 7));
        max-width: none;
        max-height: 100vh;
      }

      .web-actions {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        align-items: center;
      }

      .web-actions button.platform-btn {
        appearance: none;
        -webkit-appearance: none;
        font: inherit;
        cursor: pointer;
      }

      .web-back {
        position: relative;
        flex-direction: row;
        min-width: 0;
        padding: 10px 16px;
      }

      .web-fullscreen {
        position: relative;
        flex-direction: row;
        min-width: 0;
        padding: 10px 16px;
      }
    </style>
  </head>
  <body>
    <div class="web-shell">
      <div id="status">Downloading...</div>
      <progress value="0" max="100" id="progress" hidden></progress>
      <div class="canvas-stage" id="canvas-stage">
        <div class="canvas-frame">
          <canvas class="emscripten" id="canvas" width="320" height="560" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        </div>
      </div>
      <div class="web-actions">
        <a class="platform-btn web web-back" href="https://inbe.waozi.xyz/">
          <span>Back to Inner Breeze</span>
        </a>
        <button class="platform-btn web web-back web-fullscreen" id="fullscreen-btn" type="button">
          <span>Fullscreen</span>
        </button>
      </div>
    </div>

    <script>
      var statusElement = document.querySelector('#status');
      var progressElement = document.querySelector('#progress');
      var fullscreenButton = document.querySelector('#fullscreen-btn');
      var canvasStage = document.querySelector('#canvas-stage');

      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function updateFullscreenButton() {
        fullscreenButton.textContent = fullscreenElement() ? 'Exit fullscreen' : 'Fullscreen';
      }

      fullscreenButton.addEventListener('click', function() {
        if (fullscreenElement()) {
          var exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
          if (exitFullscreen) exitFullscreen.call(document);
        } else {
          var requestFullscreen = canvasStage.requestFullscreen || canvasStage.webkitRequestFullscreen;
          if (requestFullscreen) requestFullscreen.call(canvasStage);
        }
      });
      document.addEventListener('fullscreenchange', updateFullscreenButton);
      document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

      var Module = {
        preRun: [],
        postRun: [],
        print: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.log(text);
        },
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        },
        canvas: (function() {
          var canvas = document.querySelector('#canvas');
          canvas.addEventListener('webglcontextlost', function(e) {
            alert('WebGL context lost. Reload the page to continue.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;

          var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (match && now - Module.setStatus.last.time < 30) return;

          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;

          if (match) {
            statusElement.textContent = match[1];
            progressElement.value = parseInt(match[2], 10) * 100;
            progressElement.max = parseInt(match[4], 10) * 100;
            progressElement.hidden = false;
          } else {
            statusElement.textContent = text;
            progressElement.hidden = true;
            if (!text) statusElement.style.display = 'none';
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };

      Module.setStatus('Downloading...');
      window.onerror = function() {
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
