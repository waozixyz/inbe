    <link rel="apple-touch-icon" href="site-icons/apple-touch-icon.png">
    <link rel="manifest" href="webmanifest.json">
    <meta name="theme-color" content="#779999">
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .canvas-stage {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body {
        background: #f4f1e8;
        color: #f7fbf9;
        font-family: ui-monospace, "SFMono-Regular", "Roboto Mono", "Cascadia Mono", "Liberation Mono", monospace;
      }

      .canvas-frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        position: relative;
      }

      canvas.emscripten {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        border: 0;
        background: #f4f1e8;
        image-rendering: auto;
      }

      .canvas-frame:fullscreen,
      .canvas-frame:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
      }

      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 38%, rgba(132, 184, 172, 0.24), transparent 36%),
          linear-gradient(180deg, #222640 0%, #17172a 58%, #10131f 100%);
        opacity: 1;
        transition: opacity 360ms ease, visibility 360ms ease;
      }

      .loading-screen.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-panel {
        width: min(360px, 100%);
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }

      .loading-mark {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      }

      .loading-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        font-weight: 700;
      }

      #status {
        min-height: 1.35em;
        color: #c9deda;
        font-size: 13px;
        line-height: 1.35;
      }

      #progress {
        width: min(280px, 100%);
        height: 8px;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      #progress::-webkit-progress-bar {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      #progress::-webkit-progress-value {
        border-radius: 999px;
        background: #8fcfc2;
      }

      #progress::-moz-progress-bar {
        border-radius: 999px;
        background: #8fcfc2;
      }
    </style>
  </head>
  <body>
    <div class="loading-screen" id="loading-screen" role="status" aria-live="polite">
      <div class="loading-panel">
        <img class="loading-mark" src="site-icons/icon-192x192.png" alt="" width="76" height="76">
        <h1 class="loading-title">Inner Breeze</h1>
        <div id="status">Downloading...</div>
        <progress value="0" max="100" id="progress" hidden></progress>
      </div>
    </div>
    <div class="canvas-stage">
      <div class="canvas-frame" id="canvas-frame">
        <canvas class="emscripten" id="canvas" width="320" height="560" tabindex="-1"></canvas>
      </div>
    </div>

    <script src="index_boot.js?v=WEB_CACHE_BUSTER"></script>
    {{{ SCRIPT }}}
  </body>
</html>
