<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inner Breeze</title>
    <link href="/style.css" rel="stylesheet">
    <link href="/inbe.css" rel="stylesheet">
    <style>
      .web-shell {
        max-width: 560px;
      }

      #status {
        margin: 0;
        color: var(--dark);
        font-size: 13px;
        text-align: center;
      }

      #progress {
        width: min(480px, 100%);
      }

      .web-player {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .web-canvas-frame {
        width: 480px;
        max-width: 100%;
        background: #000000;
        border: 2px solid var(--dark);
        border-right-color: var(--button-highlight);
        border-bottom-color: var(--button-highlight);
        box-shadow:
          inset 1px 1px 0 0 var(--shadow),
          1px 1px 0 0 var(--button-highlight);
      }

      canvas.emscripten {
        display: block;
        width: 480px;
        height: 640px;
        max-width: 100%;
        aspect-ratio: 3 / 4;
        border: 0;
        background: black;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div class="content web-shell">
      <section>
        <div class="platform-header">
          <img src="/icons/inbe.png" alt="Inner Breeze">
          <div>
            <strong>Inner Breeze</strong>
            <p>WebAssembly build</p>
          </div>
        </div>

        <div class="web-player">
          <div id="status">Downloading...</div>
          <progress value="0" max="100" id="progress" hidden></progress>
          <div class="web-canvas-frame">
            <canvas class="emscripten" id="canvas" width="480" height="640" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
          </div>
          <div class="platform-buttons">
            <a class="platform-btn web" href="https://inbe.waozi.xyz/">
              <img src="/icons/inbe.png" alt="">
              <span>Back to Inner Breeze</span>
            </a>
          </div>
        </div>
      </section>
    </div>

    <script>
      var statusElement = document.querySelector('#status');
      var progressElement = document.querySelector('#progress');
      var Module = {
        preRun: [],
        postRun: [],
        print: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.log(text);
        },
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        },
        canvas: (function() {
          var canvas = document.querySelector('#canvas');
          canvas.addEventListener('webglcontextlost', function(e) {
            alert('WebGL context lost. Reload the page to continue.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;

          var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (match && now - Module.setStatus.last.time < 30) return;

          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;

          if (match) {
            statusElement.textContent = match[1];
            progressElement.value = parseInt(match[2], 10) * 100;
            progressElement.max = parseInt(match[4], 10) * 100;
            progressElement.hidden = false;
          } else {
            statusElement.textContent = text;
            progressElement.hidden = true;
            if (!text) statusElement.style.display = 'none';
          }
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };

      Module.setStatus('Downloading...');
      window.onerror = function() {
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
